<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Employee Health Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6', // Blue 500
                        secondary: '#10b981', // Emerald 500
                        accent: '#f59e0b', // Amber 500
                        background: '#f8f9fa',
                    }
                }
            }
        }
    </script>

</head>
<body class="min-h-screen">

    <input type="file" id="fileUpload" class="hidden" accept=".xlsx, .xls,.csv" multiple> 
    
    <header class="bg-white p-4 flex justify-between items-center header-shadow sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="logo-container" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 12px; padding: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <div class="text-2xl font-bold text-primary">
                Corporate <span id="companyNameDisplay" class="text-gray-700">Wellness</span>
            </div>
        </div>
        <div class="text-sm text-gray-500">
            Today is <span id="currentDate">--/--/----</span>
        </div>
    </header>

    <main class="p-6 md:p-8" style="max-width: 100%; overflow-x: hidden; box-sizing: border-box;">
        <div class="bg-white rounded-2xl p-4 md:p-5 mb-6 shadow-md max-w-5xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
        <div class="flex justify-center md:justify-start">
            <div class="inline-flex items-stretch rounded-xl border border-gray-200 bg-white overflow-hidden">
                <div class="px-5 py-2.5 text-center min-w-[140px]">
                    <div class="text-[11px] tracking-wide uppercase text-gray-500 font-semibold">Selected Year</div>
                    <div class="text-2xl leading-none font-extrabold text-primary mt-1" id="currentYearDisplay">2025</div>
                </div>
            </div>
        </div>

        <div class="flex justify-center">
            <div class="inline-flex items-stretch rounded-xl border border-gray-200 bg-white overflow-hidden">
                <div class="px-5 py-2.5 text-center min-w-[160px] flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; flex-shrink: 0;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <div>
                        <div class="text-[11px] tracking-wide uppercase text-gray-500 font-semibold">Total Corporates</div>
                        <div class="text-2xl leading-none font-extrabold text-primary mt-1" id="numCompaniesValue">0</div>
                    </div>
                </div>
                <div class="w-px bg-gray-200"></div>
                <div class="px-5 py-2.5 text-center min-w-[160px] flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; flex-shrink: 0;">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <div>
                        <div class="text-[11px] tracking-wide uppercase text-gray-500 font-semibold">People Screened</div>
                        <div class="text-2xl leading-none font-extrabold text-secondary mt-1" id="numScreenedValue">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-center md:justify-end">
            <button class="inline-flex items-center justify-center px-5 py-2.5 bg-accent text-white font-semibold rounded-xl shadow-lg hover:bg-amber-600 transition duration-150 transform hover:scale-[1.02] w-full md:w-auto md:min-w-[140px]" onclick="openLoginPopup();">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3v-1"></path></svg>
                Login
            </button>
        </div>
    </div>
</div>
        

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4 mb-6">

            <div class="bg-white rounded-xl shadow-md chart-container p-4">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Age/Gender</div>
                <canvas id="chartParticipants"></canvas>
            </div>
            
    
            <div class="bg-white rounded-xl shadow-md chart-container p-4 transition-all duration-300 hover:shadow-lg">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Chronic Disease Status</div>
             <div id="chartChronic"></div>
            </div>

            <div class="bg-white rounded-xl shadow-md chart-container p-4">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Hypertension Risk (BP)</div>
                <div id="chartHypertension"></div>
            </div>

            <div class="bg-white rounded-xl shadow-md chart-container p-4">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Diabetes Risk</div>
                <div id="chartDiabetes"></div>
            </div>

            <div class="bg-white rounded-xl shadow-md chart-container p-4">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Dyslipidemia Risk</div>
                <div id="chartCholestrol"></div>
            </div>
        </div>


        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6 justify-items-center" style="max-width: 100%; box-sizing: border-box;">
            
            
            
            <div class="bg-white rounded-xl shadow-md chart-container p-4 w-full">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Obesity Risk</div>
                <div id="chartObesity"></div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md chart-container p-4 w-full">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Fitness Level</div>
                <div id="chartFitness"></div>
            </div>

            <div class="bg-white rounded-xl shadow-md chart-container p-4 w-full">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Stress level</div>
                <div id="chartStress"></div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md chart-container p-4 w-full">
                <div class="text-sm font-semibold text-center mb-2 text-gray-700">Medication</div>
                <div id="chartMedication"></div>
            </div>
        </div>
        
    </main>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <script src="data-loader.js"></script>
    <script src="charts-logic.js"></script>
    <script src="script.js"></script>

    <!-- Login Modal (kept INSIDE body for proper centering/layout) -->
    <div id="loginModal" class="fixed inset-0 hidden z-50 items-center justify-center bg-black/50 p-4">
        <div class="relative w-full max-w-xl overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-black/10 md:max-w-2xl">
            <button onclick="closeLoginModal()" class="absolute right-2 top-2 z-10 rounded-lg bg-white/90 p-2 text-gray-400 shadow-sm ring-1 ring-black/10 hover:bg-white hover:text-gray-600">
                <span class="sr-only">Close</span>
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <iframe id="loginFrame" src="loginpage2.html" class="block w-full border-0 h-[80vh] max-h-[820px] min-h-[620px]"></iframe>
        </div>
    </div>

</body>
</html>
