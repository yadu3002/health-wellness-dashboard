<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Modal</title>
<link rel="stylesheet" href="loginpage2.css">
<script defer src="loginpage2.js"></script>
</head>
<body>

<div class="overlay" id="overlay">
    <div class="modal-box">
        
        <!-- Role Selection Step -->
        <div class="step step-select" id="step-select">
            <div class="header">
                <div class="icon-circle" id="welcome-icon">
                    <!-- Health/Wellness icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="28" height="28">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.5 12h4l1.5-3 3 8 1.5-5h5.5"/>
                    </svg>
                </div>
                <h2>Welcome Back</h2>
                <p>Choose your account type to continue</p>
            </div>

            <div class="role-list">
                <div class="role-item" data-role="Admin">
                    <div class="role-left">
                        <div class="role-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3>Admin</h3>
                            <p>System administrator access</p>
                        </div>
                    </div>
                    <div class="arrow">→</div>
                </div>

                <div class="role-item" data-role="Corporate">
                    <div class="role-left">
                        <div class="role-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                            </svg>
                        </div>
                        <div>
                            <h3>Corporate</h3>
                            <p>Business account access</p>
                        </div>
                    </div>
                    <div class="arrow">→</div>
                </div>

                <div class="role-item" data-role="Individual">
                    <div class="role-left">
                        <div class="role-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3>Individual</h3>
                            <p>Personal account access</p>
                        </div>
                    </div>
                    <div class="arrow">→</div>
                </div>
            </div>
        </div>

        <!-- Login Step -->
        <div class="step step-login hidden" id="step-login">
            <button class="back-btn" id="back-btn">← Back to role selection</button>
            <div class="header">
                <div class="icon-circle login" id="login-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 id="login-title">Login</h2>
                <p>Enter your credentials to access your account</p>
            </div>

            <form id="login-form"> 
                <label>Username</label>
                <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="off" required>
                <label>Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="off" required>
                <div class="options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button class="submit-btn" type="submit">Sign In</button>
            </form>
            <div class="footer">
                <p>Don't have an account? <a href="#">Create one here</a></p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
